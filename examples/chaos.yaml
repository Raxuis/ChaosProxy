target: http://localhost:9000
seed: 42
cors: reflect

rules:
  - name: slow-search
    match: GET /api/search*
    latency:
      dist: fixed
      value: 800ms
      jitter: 200ms

  - name: unavailable-orders
    match: POST /api/orders
    status:
      code: 503
      probability: 1
      retry_after: 2

  - name: expired-session
    match: GET /api/session
    redirect:
      probability: 1
      code: 302
      location: /login

  - name: hanging-profile
    match: GET /api/profile
    hang:
      probability: 0.1

  - name: broken-user-payload
    match: GET /api/user/*
    truncate:
      probability: 0.1
      at: 0.5

  - name: broken-profile
    match: GET /api/account
    mutate:
      probability: 0.5
      operations:
        - op: nullify
          path: user.email
        - op: stretch
          path: user.name
          factor: 20

  - name: stale-cached-response
    match: GET /api/config
    headers:
      probability: 0.5
      set:
        Cache-Control: max-age=86400
        X-Chaos-Fault: injected
      remove:
        - ETag

  - name: reset-checkout
    match: POST /api/checkout
    reset:
      probability: 0.2

  - name: slow-assets
    match: GET /static/**
    bandwidth:
      bytes_per_second: 32768

scenarios:
  - name: payment-recovers
    match: POST /api/payments
    on_exhausted: passthrough
    steps:
      - status=503
      - latency=2s; status=502
      - off
